<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام النتائج - مريم</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f2f4f7; font-family: Tahoma; }
  .box { background:white; padding:20px; border-radius:12px; margin-bottom:15px; }
  .student { background:#f8f9fa; border:1px solid #ddd; padding:10px; border-radius:8px; margin:5px 0; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<div class="container py-4">
<h2 class="text-center mb-4">🎓 نظام إدارة النتائج</h2>

<div class="box">
  <label class="form-label">اسم الطالب</label>
  <input type="text" id="studentName" class="form-control" placeholder="اسم الطالب">
  <label class="form-label mt-2">نسبة الحضور %</label>
  <input type="number" id="attendance" class="form-control" placeholder="0 - 100">
  <div class="row mt-2">
    <div class="col"><input type="number" id="grade1" class="form-control" placeholder="المادة 1"></div>
    <div class="col"><input type="number" id="grade2" class="form-control" placeholder="المادة 2"></div>
    <div class="col"><input type="number" id="grade3" class="form-control" placeholder="المادة 3"></div>
  </div>
  <div class="row mt-3">
    <div class="col"><button class="btn btn-primary w-100" id="addBtn">إضافة طالب</button></div>
    <div class="col"><button class="btn btn-success w-100" id="mercyBtn">تفعيل لجنة الرأفة</button></div>
  </div>
  <div id="errorBox" class="text-danger mt-2" style="display:none;"></div>
</div>

<div class="box">
  <h5>قائمة الطلاب:</h5>
  <div id="studentsListDiv"></div>
</div>

<div class="box">
  <h5>التقرير النهائي للجنة الرأفة:</h5>
  <div id="reportDiv">لم يتم تفعيل اللجنة بعد.</div>
</div>
</div>

<script>
class Student {
  #grades;
  #attendance;
  constructor(name, g1, g2, g3, attendance) {
    if (!name || name.trim() === "") throw new Error("ادخل اسم الطالب");
    this.name = name.trim();
    this.grades = [g1, g2, g3];
    this.attendance = attendance;
  }
  set grades(arr) {
    let vals = arr.map(v => Number(v));
    for (let v of vals) {
      if (v === "" || isNaN(v)) throw new Error("ادخل درجات صحيحة");
      if (v < 0 || v > 100) throw new Error("الدرجة لازم بين 0 و 100");
    }
    this.#grades = vals;
  }
  get grades() { return this.#grades; }
  set attendance(val) {
    if (val === "" || val === null || isNaN(Number(val))) throw new Error("ادخل الحضور");
    if (Number(val) < 0 || Number(val) > 100) throw new Error("الحضور لازم بين 0 و 100");
    this.#attendance = Number(val);
  }
  get attendance() { return this.#attendance; }
  getAverage() {
    return (this.#grades[0] + this.#grades[1] + this.#grades[2]) / 3;
  }
  getStatus() {
    return this.getAverage() >= 40 ? "ناجح ✅" : "محتاج تحسين";
  }
}

let studentsList = [];
let studentsListDiv = document.getElementById("studentsListDiv");
let reportDiv = document.getElementById("reportDiv");
let errorBox = document.getElementById("errorBox");

function displayStudent(s) {
  let div = document.createElement("div");
  div.className = "student";
  div.innerHTML = `<span><b>${s.name}</b> - درجات: ${s.grades.join(" - ")} - حضور: ${s.attendance}%</span><span>المتوسط: ${s.getAverage().toFixed(2)} - ${s.getStatus()}</span>`;
  studentsListDiv.appendChild(div);
}

// مريم بس - المتوسط 52
let mariam = new Student("مريم", 52, 53, 51, 90);
studentsList.push(mariam);
displayStudent(mariam);

document.getElementById("addBtn").onclick = function() {
  try {
    errorBox.style.display = "none";
    let s = new Student(
      document.getElementById("studentName").value,
      document.getElementById("grade1").value,
      document.getElementById("grade2").value,
      document.getElementById("grade3").value,
      document.getElementById("attendance").value
    );
    studentsList.push(s);
    displayStudent(s);
    document.getElementById("studentName").value = "";
    document.getElementById("grade1").value = "";
    document.getElementById("grade2").value = "";
    document.getElementById("grade3").value = "";
    document.getElementById("attendance").value = "";
  } catch (error) {
    errorBox.textContent = error.message;
    errorBox.style.display = "block";
  }
};

document.getElementById("mercyBtn").onclick = function() {
  let eligible = studentsList.filter(s => {
    let avg = s.getAverage();
    return avg >= 40 && avg <= 55;
  });
  if (eligible.length === 0) {
    reportDiv.innerHTML = "لا يوجد طلاب مستحقين للرأفة.";
    return;
  }
  let newAverages = eligible.map(s => s.getAverage() + 5);
  let oldGeneral = eligible.reduce((sum, s) => sum + s.getAverage(), 0) / eligible.length;
  let general = newAverages.reduce((sum, val) => sum + val, 0) / newAverages.length;

  let html = `<b>عدد الطلاب المتعثرين:</b> ${eligible.length}<br>`;
  html += `<b>أسماء المستفيدين:</b> ${eligible.map(s => s.name).join(" - ")}<br>`;
  html += `<b>المتوسط العام بعد الرأفة:</b> من ${oldGeneral.toFixed(2)} الى ${general.toFixed(2)}<br><hr>`;
  eligible.forEach((s, i) => {
    html += `${s.name}: من ${s.getAverage().toFixed(2)} الى ${newAverages[i].toFixed(2)}<br>`;
  });
  reportDiv.innerHTML = html;
};
</script>
</body>
</html>
